# Read by the SonarQube scanner (projectBaseDir: client). The workflow passes the
# project key, sources and exclusions on the command line; only extra settings live here.

# Tailwind CSS 4 is configured in CSS with at-rules (@plugin, @source, @custom-variant,
# @utility, @theme) that the generic CSS rule S4662 does not know. Skip that one rule for
# the Tailwind entry stylesheet only; every other CSS rule still applies to it.
sonar.issue.ignore.multicriteria=tailwindAtRules
sonar.issue.ignore.multicriteria.tailwindAtRules.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwindAtRules.resourceKey=**/app/styles/globals.css
